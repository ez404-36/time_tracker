[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["TimeTracker contributors"]
license = "MIT"
repository = "https://github.com/egor/timetracker"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dioxus = { version = "0.7", features = ["desktop"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
